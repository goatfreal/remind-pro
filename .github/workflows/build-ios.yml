name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA for iOS
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Generate Xcode Project)
        run: npx expo prebuild --platform ios --clean

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild clean build \
            -workspace RemindPro.xcworkspace \
            -scheme RemindPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app into .ipa
        run: |
          mkdir -p build-output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/RemindPro.app build-output/Payload/
          cd build-output
          zip -r RemindPro.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemindPro-iOS-IPA
          path: build-output/RemindPro.ipa
          retention-days: 14
